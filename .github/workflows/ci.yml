name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Claude Code (native installer, stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin validate .
      - name: every pinned source resolves
        env:
          GH_TOKEN: ${{ secrets.CATALOG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          cat = json.load(open('.claude-plugin/marketplace.json'))
          bad = 0
          for p in cat['plugins']:
              src = p['source']
              if isinstance(src, dict) and src.get('source') == 'github':
                  ref = src.get('sha') or src.get('ref') or 'main'
                  # The workflow token is scoped to this repository. A private
                  # plugin repository is invisible to it, so skip rather than fail;
                  # set CATALOG_READ_TOKEN as GH_TOKEN to check private repositories.
                  seen = subprocess.run(['gh', 'api', f"repos/{src['repo']}"], capture_output=True, text=True)
                  if seen.returncode != 0:
                      print(p['name'], src['repo'], 'not visible to this token; skipped')
                      continue
                  r = subprocess.run(['gh', 'api', f"repos/{src['repo']}/commits/{ref}", '--jq', '.sha'], capture_output=True, text=True)
                  print(p['name'], src['repo'], ref, 'ok' if r.returncode == 0 else 'MISSING')
                  bad += r.returncode != 0
          sys.exit(1 if bad else 0)
          PY
